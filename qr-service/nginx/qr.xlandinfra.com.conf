# Nginx Configuration for qr.xlandinfra.com
# XLAND INFRA Dynamic QR Redirect Service
#
# Installation:
# 1. Copy this file to /etc/nginx/sites-available/qr.xlandinfra.com
# 2. Create symlink: ln -s /etc/nginx/sites-available/qr.xlandinfra.com /etc/nginx/sites-enabled/
# 3. Test config: nginx -t
# 4. Reload nginx: systemctl reload nginx

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=qr_limit:10m rate=30r/m;

# Upstream QR service (PM2 cluster)
upstream qr_service {
    least_conn;
    server 127.0.0.1:3500 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name qr.xlandinfra.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qr.xlandinfra.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/qr.xlandinfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.xlandinfra.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (uncomment after confirming SSL works)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/qr.xlandinfra.com.access.log;
    error_log /var/log/nginx/qr.xlandinfra.com.error.log;

    # Health check endpoint (no rate limit)
    location = /health {
        proxy_pass http://qr_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Favicon
    location = /favicon.ico {
        return 204;
        access_log off;
    }

    # Robots.txt - Disallow all crawling
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Main QR redirect endpoints
    location / {
        # Rate limiting
        limit_req zone=qr_limit burst=10 nodelay;
        limit_req_status 429;

        # Proxy to QR service
        proxy_pass http://qr_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Error pages
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # Custom error page
    location = /50x.html {
        root /var/www/html;
        internal;
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><title>QR Service</title><style>body{font-family:system-ui;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#1a1a1a;color:#d4af37}div{text-align:center}h1{font-size:3em;margin-bottom:0.2em}p{color:#888}</style></head><body><div><h1>XLAND INFRA</h1><p>QR Service temporarily unavailable. Please try again.</p></div></body></html>';
    }
}
